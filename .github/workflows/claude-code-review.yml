# Automatic Claude review on pull requests (#17).
#
# Runs the code-review plugin's skill and posts the result on the pull
# request: an inline comment per issue found, or one summary comment when
# there are none. Claude skips draft and closed pull requests, and pull
# requests that already have a comment from Claude.
#
# Auth: Claude subscription token in the CLAUDE_CODE_OAUTH_TOKEN repository
# secret (generate with `claude setup-token`). For API billing instead, set
# ANTHROPIC_API_KEY and replace the token input with
#   anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
#
# Docs: https://code.claude.com/docs/en/github-actions#run-a-skill
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A new push cancels a review still running for the same pull request.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Read-only workflow token. Comments are posted as the Claude GitHub App,
    # which the action authenticates through the OIDC token (id-token).
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Must name the inline-comment tool, or the action does not start
          # the server that posts inline comments.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
