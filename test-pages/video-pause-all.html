<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video With a Pause-All Control</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 800px;
      margin: 2rem auto;
      padding: 1rem;
      line-height: 1.6;
      color: #333;
    }
    h1 { color: #0066cc; }
    video { display: block; width: 200px; height: 120px; background: #ccc; margin: 0.5rem 0; }
  </style>
</head>
<body>
  <!--
    WCAG 2.2.2 / Trusted Tester 2.B fixture: one "Pause all videos" control
    is the first element on the page, so it is a mechanism for every video
    (first-three-elements rule), even the ones far down the page.
  -->
  <button type="button" id="pause-all">Pause all videos</button>
  <h1>Video With a Pause-All Control</h1>
  <p>Two autoplaying videos share one pause control at the top of the page.</p>

  <video id="first" autoplay loop muted data-expect="review"></video>

  <p>Filler paragraph one.</p>
  <p>Filler paragraph two.</p>
  <p>Filler paragraph three.</p>
  <p>Filler paragraph four.</p>
  <p>Filler paragraph five.</p>

  <video id="second" autoplay loop muted data-expect="review"></video>

  <hr>
  <p><a href="index.html">← Back to index</a></p>

  <script>
    document.getElementById('pause-all').addEventListener('click', () => {
      for (const v of document.querySelectorAll('video')) v.pause();
    });
  </script>
</body>
</html>
